name: Deploy React Vite Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # 1. FIXED: 'defaults' is now placed correctly at the job-level
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' 

      # 2. Runs directly inside the frontend folder thanks to the job default above
      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      # 3. We temporarily clear the directory target so the setup action runs at the repository root
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 4. Uploads the generated compilation folder directly to GitHub Pages
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
